# Blueprint di Render: un servizio web e un database PostgreSQL, regione Francoforte.
# Piano scelto dal committente il 14/11/2026: PROVA GRATUITA.
#   - sito gratuito: si addormenta dopo 15 minuti senza visite;
#   - database gratuito: scade 30 giorni dopo la creazione, senza copie di sicurezza.
# Per passare alla produzione cambiare i due "plan" (sito: 0.5c-512mb, database: 0.1c-256mb)
# SOLO dopo conferma del committente: comporta costi.

services:
  - type: web
    name: gestionale-multiazienda
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TZ
        value: Europe/Rome
      - key: DATABASE_URL
        fromDatabase:
          name: gestionale-multiazienda-db
          property: connectionString
      - key: ADMIN_KEY          # chiave del pannello /admin, generata da Render
        generateValue: true
      # Posta: sul piano gratuito Render blocca l'invio di e-mail (porte SMTP chiuse).
      # Il gestionale funziona anche senza: i codici di accesso si generano dal pannello /admin
      # (pulsante "Accessi") e le e-mail non partite restano leggibili nel registro della posta.
      # Quando servirà, aggiungere a mano nel servizio: PIATTAFORMA_EMAIL, SMTP_HOST, SMTP_PORT,
      # SMTP_USER, SMTP_PASS, SMTP_FROM.

databases:
  - name: gestionale-multiazienda-db
    plan: free
    region: frankfurt
    ipAllowList: []            # il database non è raggiungibile da Internet
